
services:
  api:
    build:
      dockerfile: server.dockerfile
      context: .
  
    environment:
      - DB_PATH=/components.db
      - PORT=3001
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./components.db:/components.db

  reverse-proxy:
    build:
      dockerfile: frontend.dockerfile
      context: .
    ports:
      - 3000:3000

    depends_on:
      - api